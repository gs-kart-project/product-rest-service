# MySQL db settings
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/productDb
spring.datasource.username=product-gskart
spring.datasource.password=Product@gskart
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Flyway DB Migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.password=${spring.datasource.password}
spring.flyway.user=${spring.datasource.username}
spring.flyway.schemas=productDb
spring.flyway.locations=classpath:db/migration/productDb

#GsKart Settings
gskart.service.auth=http://localhost:4011

# Elasticsearch (product search index). Auth is required even locally; TLS is optional locally but
# switching to https:// here (plus a truststore, if the cert isn't publicly trusted) is all that's
# needed to harden for prod - no code change.
spring.elasticsearch.uris=${ES_URI:http://localhost:9200}
spring.elasticsearch.username=${ES_USER:elastic}
spring.elasticsearch.password=${ELASTIC_PASSWORD}

# Kafka (async outbox -> index pipeline). SASL_PLAINTEXT+PLAIN locally; prod should override
# KAFKA_SECURITY_PROTOCOL=SASL_SSL (plus spring.kafka.ssl.* trust-store props) - config only, no code change.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USER:gskart}" password="${KAFKA_PASSWORD}";

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=product-rest-service
spring.kafka.consumer.auto-offset-reset=earliest
# Deserialization failures (a malformed/poison-pill record) happen before the listener runs, so
# without ErrorHandlingDeserializer the DefaultErrorHandler/DLT recoverer never sees them and the
# container just re-polls the same bad record forever. Wrapping the real deserializers lets a
# failure surface as a listener exception instead, so it flows through the same retry -> DLT path.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gskart.product.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.gskart.product.events.ProductEvent

gskart.product.events.topic=product.events.v1

# Outbox fallback relay (immediate publish happens on tx commit; this is the safety-net sweep)
gskart.product.outbox.relay.fixed-delay-ms=1000
gskart.product.outbox.relay.batch-size=50
gskart.product.outbox.relay.max-attempts=5

# Recovery for outbox rows a crash leaves stuck IN_PROGRESS between claim and mark-outcome (M3).
# The threshold must comfortably exceed the Kafka send timeout (5s) + retry backoff so a merely
# slow-but-live publish is never reclaimed out from under itself.
gskart.product.outbox.relay.stuck-recovery-delay-ms=30000
gskart.product.outbox.relay.stuck-recovery-threshold-ms=60000

# Outbox housekeeping (M4): purge SENT rows past their retention window; also logs a warning with
# the current FAILED count so permanently-failed events (needing manual replay/reindex) aren't
# silently invisible.
gskart.product.outbox.purge.delay-ms=3600000
gskart.product.outbox.purge.sent-retention-hours=168

